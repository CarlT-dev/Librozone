<section class="grow flex flex-col">
    <div class="grid grid-cols-2 grow">
        <div class="flex flex-col justify-center items-center">
            <div class="border-4 border-lime-300/80 bg-white rounded-2xl  p-2 w-[80%]">
                <h2 class="text-2xl mb-4 p-2 flex justify-center border-b items-center font-bold text-lime-500/80">Admin Login</h2>
                <form id="adminLoginForm" class="flex flex-col gap-8 p-4">
                    <div>
                        <input 
                            type="email"
                            id="adminLoginEmail" 
                            class="border-b-2 w-full p-2.5 border-lime-300 focus:border-b-3 focus:border-lime-200 bg-lime-100/20 focus:bg-lime-100/40 outline-none transition-all" 
                            placeholder="Email"
                            required/>
                    </div>
                    <div>
                        <div class="relative flex flex-col justify-center">
                            <input 
                                type="password" 
                                id="adminLoginPassword" 
                                placeholder="Password"
                                class="border-b-2 w-full p-2.5 border-lime-300 focus:border-b-3 focus:border-lime-200 bg-lime-100/20 focus:bg-lime-100/40 outline-none transition-all" 
                                minlength="8"
                                required
                            />
                            <button 
                                type="button" 
                                id="togglePassword" 
                                class="absolute right-3 top-1/2 h-6 border-l w-12 bg-white/80 text-sm text-gray-400 hover:text-lime-600 focus:outline-none cursor-pointer"
                            >show
                            </button>
                        </div>
                    </div>
                    <button type="submit" id="adminLoginBtn" class="w-full mt-7 bg-lime-500/90 p-2 rounded-2xl shadow-md text-white hover:cursor-pointer hover:bg-lime-400 transition-all duration-200">Submit</button>
                </form>
            </div>
        </div>
        <div class="hidden md:flex bg-linear-to-l from-lime-200/90 via-lime-200 to-lime-100 backdrop-blur-md border-l border-white/20 p-10 shadow-xl rounded-l-[100px] justify-end items-center">
            <div class="mr-[15%]">
                <h1 class="text-lime-500 text-6xl font-black tracking-tighter">Admin</h1>
                <p class="text-lime-600/70 text-right font-medium">Management Portal</p>
            </div>
        </div>
    </div>
</section>
