<section class="grow flex flex-col">
    <div class="grid grid-cols-1 md:grid-cols-2 grow">
        <!-- Left Column: Login Form -->
        <div class="flex flex-col justify-center items-center p-4 sm:p-6 animate-slide-in-left">
            <div class="w-full max-w-md border rounded-2xl border-lime-500/20 bg-lime-500/30 p-1 shadow-sm">
                <div class="rounded-xl bg-white/85">
                    <h2 class="text-xl sm:text-2xl mb-4 p-4 flex justify-center border-b items-center font-bold text-lime-500/80">
                        Login
                    </h2>
                    <form id="studentLoginForm" class="p-6">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="studentLoginEmail">Email</label>
                            <input type="email" id="studentLoginEmail" class="border w-full p-2.5 rounded-2xl border-gray-300 focus:ring-2 focus:ring-lime-500 focus:border-transparent outline-none transition-all" required/>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="studentLoginPassword">Password</label>
                            <div class="relative flex flex-col justify-center">
                                <input 
                                    type="password" 
                                    id="studentLoginPassword" 
                                    class="border w-full p-2.5 pr-10 rounded-2xl border-gray-300 focus:ring-2 focus:ring-lime-500 focus:border-transparent outline-none transition-all" 
                                    required
                                />
                                <button 
                                    type="button" 
                                    id="togglePassword" 
                                    class="absolute right-3 top-1/2 h-6 border-l w-12 bg-white/80 text-sm text-gray-400 hover:text-lime-600 focus:outline-none cursor-pointer"
                                >show
                                </button>
                            </div>
                        </div>
                        <div>
                            <button type="submit" id="studentLoginBtn" class="w-full mt-6 bg-lime-500/90 p-3 rounded-2xl shadow-md text-white font-bold hover:cursor-pointer hover:bg-lime-400 active:scale-95 transition-all duration-200">
                                Submit
                            </button>
                            <p class="text-center text-sm text-gray-500 pt-5">
                                Don&apos;t have an account? <a href="#register" class="text-lime-600 font-semibold hover:underline">Register</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>

                <!-- Right Column: Branding -->
                <div class="hidden md:flex bg-linear-to-l from-lime-200/90 via-lime-200 to-lime-100 backdrop-blur-md border-l border-white/20 p-10 shadow-xl rounded-l-[100px] justify-center items-center animate-slide-in-right">
                    <div>
                        <h1 class="text-lime-500 text-4xl lg:text-5xl font-black tracking-tighter text-end">Welcome Back</h1>
                        <p class="text-lime-600/70 text-right font-medium">Continue your journey</p>
                    </div>
                </div>
            </div>
        </section>
