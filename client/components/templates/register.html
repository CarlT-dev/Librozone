<section class="grow flex flex-col">
    <!-- Progress bar (hidden by default, shown on next click) -->
    <div id="register-progress-bar-container" class="w-full h-1 bg-lime-100 overflow-hidden" style="display:none;">
        <div id="register-progress-bar" class="h-full bg-lime-500 w-0 transition-all duration-700 ease-in-out"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 grow">
        <!-- Left Column: Email Form -->
        <div class="flex flex-col justify-center items-center p-4 sm:p-6 animate-slide-in-left">
            <div class="w-full max-w-md border rounded-2xl border-lime-500/20 bg-lime-500/30 p-1 shadow-sm">
                <div class="rounded-xl bg-lime-50">
                    <form id="registerEmailForm" class="px-6 pb-0 rounded-2xl bg-white">
                        <h2 class="text-xl sm:text-2xl p-4 py-4 flex justify-center border-b items-center font-bold text-lime-500/80">
                            Register
                        </h2>
                        <div class="py-6">
                            <input 
                                type="email"
                                id="studentRegisterEmail" 
                                class="border-b-2 w-full p-2.5 border-lime-300 focus:border-b-3 focus:border-lime-200 focus:bg-lime-100/40 outline-none transition-all bg-white" 
                                placeholder="Enter your email address"
                                required/>
                            <p id="emailError" class="text-red-500 text-xs mt-1" style="display:none;">Please enter a valid email address.</p>
                        </div>
                        <div class="pb-6 flex justify-center items-center">
                            <button type="button" id="nextNavigation" class="w-full bg-lime-500/90 p-3 rounded-2xl shadow-md text-white font-bold hover:cursor-pointer hover:bg-lime-400 active:scale-95 transition-all duration-200">
                                Next
                            </button>
                        </div>
                        <p class="text-center text-sm text-gray-500 pb-5">
                            Already have an account? <a href="#login" class="text-lime-600 font-semibold hover:underline">Log in</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Column: Branding -->
        <div class="hidden md:flex bg-linear-to-l from-lime-200/90 via-lime-200 to-lime-100 backdrop-blur-md border-l-3 border-white/50 p-10 shadow-xl rounded-l-[100px] justify-center items-center animate-slide-in-right">
            <div>
                <h1 class="text-lime-500 text-4xl lg:text-5xl font-black tracking-tighter text-end">Get Started</h1>
                <p class="text-lime-600/70 text-right font-medium">Start your journey</p>
            </div>
        </div>
    </div>
</section>
